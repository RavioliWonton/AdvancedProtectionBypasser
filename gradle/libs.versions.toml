[versions]
agp = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.19.0"
appcompat = "1.8.0"
lifecycleRuntimeKtx = "2.11.0"
activityCompose = "1.13.0"
coroutines = "1.11.0"
# compose-bom-alpha exposes the Material 3 Expressive APIs (MaterialExpressiveTheme,
# MotionScheme, ...) as public/experimental. The stable compose-bom of the same
# version keeps them `internal`, so we use the alpha channel to enable Expressive.
composeBom = "2026.08.01"
libxposed = "102.0.0"
licensee = "1.14.1"
# play-services-base exposes GoogleApiAvailabilityLight, used to detect whether
# Google Play services is installed before installing any hook.
playServicesBase = "18.10.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
# AppCompat provides the backward-compatible per-app language APIs
# (AppCompatDelegate.setApplicationLocales) used by the in-app language picker.
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom-alpha", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Material 3. The alpha BOM makes the Expressive APIs available.
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Google Play services presence check.
play-services-base = { group = "com.google.android.gms", name = "play-services-base", version.ref = "playServicesBase" }

# libxposed
libxposed-api = { group = "io.github.libxposed", name = "api", version.ref = "libxposed" }
libxposed-service = { group = "io.github.libxposed", name = "service", version.ref = "libxposed" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# kotlin-android removed: Kotlin support is built into AGP 9+.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Validates the licenses of the dependency graph.
licensee = { id = "app.cash.licensee", version.ref = "licensee" }
