name: Release

# Build a signed release APK whenever a version tag is pushed (e.g. v1.0.0),
# then attach it to a GitHub Release. Can also be triggered manually.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Least-privilege by default: individual jobs opt back in to what they need.
permissions:
  contents: read

# Never run two release builds for the same ref at once.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Gate job: cheap, no secrets. Fails fast if anyone other than the repo owner
  # triggers the workflow, so unauthorized runs never reach the signing job.
  authorize:
    runs-on: ubuntu-latest
    steps:
      - name: Verify actor is the repository owner
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::User '$ACTOR' is not the repository owner '$OWNER'. Refusing to run the release."
            exit 1
          fi
          echo "Actor '$ACTOR' authorized."

  build:
    needs: authorize
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the GitHub Release and upload assets
    # The signing secrets live ONLY in this protected environment. GitHub pauses
    # the job here until a required reviewer (you) approves it, so nobody else
    # can produce a signed build even if they trigger the workflow.
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Validate dependency licenses
        run: ./gradlew :app:licenseeRelease --no-configuration-cache

      - name: Build signed release APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-configuration-cache

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
